<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Multiplayer – VK Play (v20)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: pan-x pan-y;
        }
        #p2p-graph-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10,10,10,0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            z-index: 10;
            cursor: pointer;
            user-select: none;
            padding: 6px;
        }
        #p2p-graph-container:hover { transform: scale(1.05); }
        #p2p-graph { display: block; }

        #interaction-menu {
            display: none;
            position: fixed;
            background: rgba(20,20,20,0.9);
            backdrop-filter: blur(15px);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
            z-index: 2000;
            min-width: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .menu-item {
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            border-radius: 10px;
            font-size: 18px;
            color: #ddd;
        }
        .menu-item:hover { background: rgba(0, 123, 255, 0.3); color: #fff; }
        .menu-item.disabled { color: #555; cursor: not-allowed; }
        .menu-header {
            font-weight: bold;
            padding: 5px 10px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 5px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }

        #nickname-modal, #vk-profile-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20,20,20,0.95);
            backdrop-filter: blur(20px);
            color: #fff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.7);
            z-index: 3000;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #nickname-modal input {
            padding: 12px;
            width: 220px;
            border: 2px solid #444;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 16px;
            outline: none;
            background: #1e1e1e;
            color: #fff;
        }
        #nickname-modal button, #vk-profile-modal button {
            padding: 10px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        #chat-modal {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 320px;
            max-height: 420px;
            background: rgba(20,20,20,0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
            z-index: 2500;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        #chat-header {
            background: #007bff;
            color: white;
            padding: 12px 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: #1a1a1a;
            min-height: 150px;
            max-height: 250px;
            font-size: 14px;
        }
        .chat-msg { margin-bottom: 8px; padding: 6px 12px; border-radius: 14px; max-width: 80%; word-wrap: break-word; }
        .chat-msg.mine { background: #007bff; color: white; margin-left: auto; }
        .chat-msg.other { background: #2c2c2c; color: #ddd; }
        .chat-time { font-size: 10px; opacity: 0.7; display: block; margin-top: 2px; }
        #chat-input-area { display: flex; border-top: 1px solid rgba(255,255,255,0.2); padding: 8px; background: #222; }
        #chat-input { flex: 1; border: 1px solid #444; border-radius: 20px; padding: 8px 14px; outline: none; font-size: 14px; background: #1a1a1a; color: #fff; }
        #chat-send { background: #007bff; color: white; border: none; border-radius: 20px; padding: 8px 16px; margin-left: 8px; cursor: pointer; font-weight: bold; }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: #fff;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #notification-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .notification {
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 28px;
            font-size: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            animation: notif-slide-in 0.4s ease-out, notif-fade-out 0.4s 2.6s forwards;
            max-width: 320px;
            text-align: center;
            pointer-events: auto;
        }
        .notification.persistent { animation: notif-slide-in 0.4s ease-out; }
        @keyframes notif-slide-in {
            from { opacity: 0; transform: translateY(-30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes notif-fade-out {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }

        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5000;
            background: rgba(20,20,20,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 10px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            gap: 15px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .ctrl-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.15s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(0, 123, 255, 0.7);
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(0,123,255,0.7);
        }

        #vk-panel-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10,10,10,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            color: white;
            padding: 10px 16px;
            font-size: 18px;
            z-index: 15;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #vk-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 360px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: rgba(10,10,10,0.85);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            z-index: 20;
            display: none;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        }
        #vk-panel.visible { display: block; }
        .vk-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .vk-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .metric-line { display: block; font-size: 0.9rem; color: #ccc; margin: 2px 0; }
        .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; margin: 6px 0; }
        .card-title { font-weight: bold; margin-bottom: 6px; color: #aaa; }
        .card-value { font-size: 1.2rem; font-weight: 600; }
        .card-sub { font-size: 0.8rem; color: #888; }
        .tab-btn { background: none; border: none; color: #aaa; padding: 8px 12px; cursor: pointer; border-radius: 8px; margin-right: 5px; }
        .tab-btn.active { background: #007bff; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @media (max-width: 600px) {
            #vk-panel { width: 300px; left: 10px; top: 10px; }
            #p2p-graph-container { top: 80px; right: 10px; }
        }
    </style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><p>Загрузка мира...</p></div>

<div id="vk-panel-toggle"><i class="fas fa-user-circle"></i> VK Play</div>
<div id="vk-panel">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px;">
        <div class="vk-avatar" id="avatarLarge"><i class="fas fa-user-circle" style="font-size:2rem;"></i></div>
        <div>
            <div id="nicknameLarge" style="font-weight:bold; font-size:1.2rem;">Гость</div>
            <div id="userIdLarge" style="font-size:0.8rem; color:#aaa;">VK ID: ---</div>
        </div>
        <button id="editNickLargeBtn" style="margin-left:auto; background:none; border:none; color:#aaa; font-size:1.2rem;"><i class="fas fa-pen"></i></button>
        <input id="nickLargeInput" style="display:none; width:100px; background:#222; border:1px solid #555; color:#fff; border-radius:6px; padding:4px;">
    </div>
    <div id="unauthorizedBlock">
        <button id="vkLoginBtn" style="background:#007bff; color:white; border:none; padding:10px 20px; border-radius:10px; width:100%;">Войти через VK Play</button>
    </div>
    <div id="authorizedBlock" style="display:none;">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <span style="color:#4caf92;">⚡ <span id="energyLarge">100</span>/<span id="maxEnergyLarge">100</span></span>
            <span style="color:#ffd966;">💎 <span id="photonsLarge">500</span></span>
            <span style="margin-left:auto;">⭐ Ур. <span id="levelLarge">1</span></span>
        </div>
        <button id="rechargeLargeBtn" style="background:#28a745; color:white; border:none; padding:8px 16px; border-radius:8px; width:100%; margin-bottom:10px;">Восстановить энергию (20 💎)</button>
        <button id="logoutBtn" style="background:#444; color:white; border:none; padding:8px 16px; border-radius:8px; width:100%;">Выйти</button>
    </div>
    <hr style="border-color:#333; margin:15px 0;">
    <div>
        <button class="tab-btn active" data-tab="metrics">📊 Метрики</button>
        <button class="tab-btn" data-tab="science">🔬 Наука</button>
        <button class="tab-btn" data-tab="social">👥 Соц.</button>
    </div>
    <div id="tab-metrics" class="tab-content active" style="margin-top:10px;">
        <div id="gameMetrics"></div>
        <canvas id="dauMauChart" style="max-height:150px; margin-top:10px;"></canvas>
    </div>
    <div id="tab-science" class="tab-content" style="margin-top:10px;">
        <div id="scienceMetrics"></div>
        <canvas id="scienceActivityChart" style="max-height:120px; margin-top:8px;"></canvas>
    </div>
    <div id="tab-social" class="tab-content" style="margin-top:10px;">
        <div id="socialMetrics"></div>
        <canvas id="geoChart" style="max-height:120px; margin-top:8px;"></canvas>
    </div>
</div>

<div id="interaction-menu">
    <div class="menu-header" id="target-name">Игрок</div>
    <div class="menu-item" onclick="startChat()"><i class="fa-regular fa-comment"></i></div>
    <div class="menu-item" onclick="sendFile()"><i class="fa-regular fa-file"></i></div>
</div>

<div id="nickname-modal">
    <h3>Ваш никнейм</h3>
    <input type="text" id="nick-input" placeholder="Имя игрока" maxlength="12">
    <br>
    <button onclick="saveNickname()">Сохранить</button>
</div>

<div id="chat-modal">
    <div id="chat-header">
        <span id="chat-partner">💬 Чат</span>
        <span style="cursor:pointer" onclick="closeChat()">✖</span>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="200">
        <button id="chat-send" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<div id="mobile-controls">
    <button class="ctrl-btn" id="btn-up"><i class="fa-solid fa-arrow-up"></i></button>
    <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="ctrl-btn" id="btn-left"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="ctrl-btn" id="btn-right"><i class="fa-solid fa-arrow-right"></i></button>
    </div>
    <button class="ctrl-btn" id="btn-down"><i class="fa-solid fa-arrow-down"></i></button>
    <button class="ctrl-btn" id="btn-run" title="Бег"><i class="fa-solid fa-person-running"></i></button>
</div>

<div id="notification-container"></div>

<script type="text/javascript" src="https://vkplay.ru/app/47268/static/mailru.core.js"></script>
<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ---------- ГЛОБАЛЬНЫЙ СКОУП ДЛЯ VK PLAY И ИГРЫ ----------
    window.startChat = () => { if (currentTargetId) openChat(currentTargetId, currentTargetNick); hideMenu(); };
    window.sendFile = () => { alert("Файлы пока не поддерживаются."); hideMenu(); };
    window.saveNickname = () => {
        const val = document.getElementById('nick-input').value.trim();
        if (val && val !== currentPlayer.nickname) {
            currentPlayer.nickname = val;
            savePlayer(currentPlayer);
            applyNicknameToGame(val);
        }
        document.getElementById('nickname-modal').style.display = 'none';
    };
    window.closeChat = () => {
        document.getElementById('chat-modal').style.display = 'none';
        currentTargetId = null;
        toggleMobilePanel(true);
    };
    window.sendChatMessage = () => {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !currentTargetId || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'chat', to: currentTargetId, text, timestamp: Date.now() }));
        input.value = '';
    };

    // ---------- VK PLAY ИНТЕГРАЦИЯ ----------
    const APP_ID = 47268;
    let vkApi = null;
    let currentVkUser = null;
    let currentPlayer = { nickname: 'Игрок', level: 1, energy: 100, maxEnergy: 100, photons: 500 };
    
    function showToast(msg) {
        const container = document.getElementById('notification-container');
        const div = document.createElement('div');
        div.className = 'notification';
        div.innerText = msg;
        container.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }

    function savePlayer(player) {
        if (!currentVkUser) return;
        localStorage.setItem(`snowflake_player_${currentVkUser.uid}`, JSON.stringify(player));
        currentPlayer = player;
        updateProfileUI();
    }

    function loadPlayer(vkUser) {
        const saved = localStorage.getItem(`snowflake_player_${vkUser.uid}`);
        if (saved) {
            currentPlayer = JSON.parse(saved);
        } else {
            currentPlayer = {
                nickname: vkUser.first_name || `Школьник ${vkUser.uid}`,
                level: 1,
                energy: 100,
                maxEnergy: 100,
                photons: 500
            };
            savePlayer(currentPlayer);
        }
        return currentPlayer;
    }

    function updateProfileUI() {
        if (!currentPlayer || !currentVkUser) return;
        document.getElementById('nicknameLarge').innerText = currentPlayer.nickname;
        document.getElementById('levelLarge').innerText = currentPlayer.level;
        document.getElementById('energyLarge').innerText = currentPlayer.energy;
        document.getElementById('maxEnergyLarge').innerText = currentPlayer.maxEnergy;
        document.getElementById('photonsLarge').innerText = currentPlayer.photons;
        document.getElementById('userIdLarge').innerText = currentVkUser.uid;
        const avatarDiv = document.getElementById('avatarLarge');
        avatarDiv.innerHTML = '';
        let avatarUrl = currentVkUser.photo || currentVkUser.photo_100 || null;
        if (avatarUrl) {
            const img = document.createElement('img');
            img.src = avatarUrl;
            img.alt = "avatar";
            avatarDiv.appendChild(img);
        } else {
            avatarDiv.innerHTML = '<i class="fas fa-user-circle" style="font-size:2rem;"></i>';
        }
    }

    function editNickname() {
        const span = document.getElementById('nicknameLarge');
        const input = document.getElementById('nickLargeInput');
        const editBtn = document.getElementById('editNickLargeBtn');
        span.style.display = 'none';
        input.style.display = 'inline-block';
        editBtn.style.display = 'none';
        input.value = currentPlayer.nickname;
        input.focus();
        function finish() {
            const newNick = input.value.trim();
            if (newNick !== '') {
                currentPlayer.nickname = newNick;
                savePlayer(currentPlayer);
                applyNicknameToGame(newNick);
            }
            span.style.display = 'inline-block';
            input.style.display = 'none';
            editBtn.style.display = 'inline-block';
            span.innerText = currentPlayer.nickname;
            input.removeEventListener('blur', finish);
        }
        input.addEventListener('blur', finish);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') input.blur(); });
    }

    function rechargeEnergy() {
        if (!currentPlayer) return;
        const cost = 20;
        if (currentPlayer.photons >= cost) {
            currentPlayer.photons -= cost;
            currentPlayer.energy = Math.min(currentPlayer.energy + 50, currentPlayer.maxEnergy);
            savePlayer(currentPlayer);
            showToast(`Энергия +50. Фотонов: ${currentPlayer.photons}`);
        } else {
            showToast(`Не хватает фотонов (нужно ${cost})`);
        }
    }

    function showAuthorizedUI() {
        document.getElementById('unauthorizedBlock').style.display = 'none';
        document.getElementById('authorizedBlock').style.display = 'block';
        updateProfileUI();
    }
    function showUnauthorizedUI() {
        document.getElementById('unauthorizedBlock').style.display = 'block';
        document.getElementById('authorizedBlock').style.display = 'none';
        currentVkUser = null;
    }

    // Инициализация VK Play API
    (function apiHandshake(iframeApi) {
        if (typeof iframeApi === 'undefined') {
            showToast('VK Play API не загружен. Демо-режим.');
            showUnauthorizedUI();
            return;
        }
        const callbacks = {
            appid: APP_ID,
            getLoginStatusCallback: function(status) {
                const isAuth = status && (status.session || status.auth === true || status === 2 || (typeof status === 'object' && status.uid));
                if (isAuth) vkApi.userInfo();
                else showUnauthorizedUI();
            },
            userInfoCallback: function(info) {
                if (info && info.uid) {
                    currentVkUser = info;
                    loadPlayer(info);
                    showAuthorizedUI();
                    applyNicknameToGame(currentPlayer.nickname);
                } else showUnauthorizedUI();
            },
            registerUserCallback: function() { vkApi.userInfo(); },
            getAuthTokenCallback: function(token) { if (token && token.hash) vkApi.userInfo(); }
        };
        function connected(api) {
            vkApi = api;
            vkApi.getLoginStatus();
            setTimeout(() => vkApi.getAuthToken(), 1000);
        }
        iframeApi(callbacks).then(connected, (err) => { console.error(err); showUnauthorizedUI(); });
    }(window.iframeApi));

    document.getElementById('vkLoginBtn')?.addEventListener('click', () => {
        if (vkApi) vkApi.authUser();
        else showToast('API не готов');
    });
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        if (currentVkUser) localStorage.removeItem(`snowflake_player_${currentVkUser.uid}`);
        showUnauthorizedUI();
        if (vkApi) vkApi.getLoginStatus();
    });
    document.getElementById('editNickLargeBtn')?.addEventListener('click', editNickname);
    document.getElementById('rechargeLargeBtn')?.addEventListener('click', rechargeEnergy);

    // Переключение вкладок аналитики
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
        });
    });

    // Панель VK Play
    const vkPanel = document.getElementById('vk-panel');
    document.getElementById('vk-panel-toggle').addEventListener('click', () => {
        vkPanel.classList.toggle('visible');
    });

    // ---------- СЕТЬ И ИГРА ----------
    const SERVER_URL = "wss://game-ws-server.onrender.com";
    let myId = null;
    let myNickname = "Игрок";
    const players = new Map();
    const unreadCounts = new Map();
    const ws = new WebSocket(SERVER_URL);
    
    ws.onopen = () => console.log('WebSocket подключён');
    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        switch (msg.type) {
            case 'welcome':
                myId = msg.id;
                myNickname = currentPlayer?.nickname || ("Игрок " + myId.slice(0,4));
                msg.players.forEach(p => {
                    if (p.id !== myId) addRemotePlayer(p.id, p.nick);
                });
                if (currentVkUser) applyNicknameToGame(currentPlayer.nickname);
                drawGraph();
                break;
            case 'player-joined':
                if (msg.id !== myId) addRemotePlayer(msg.id, msg.nick);
                break;
            case 'player-left':
                removeRemotePlayer(msg.id);
                break;
            case 'nickname-changed':
                if (msg.id !== myId && players.has(msg.id)) {
                    const p = players.get(msg.id);
                    p.nick = msg.nick;
                    updateRemoteLabel(msg.id, msg.nick);
                    drawGraph();
                }
                break;
            case 'pos':
                if (msg.id !== myId && players.has(msg.id)) {
                    const p = players.get(msg.id);
                    p.targetPos.set(msg.x, msg.y, msg.z);
                    p.targetRot.set(msg.rx, msg.ry, msg.rz, msg.rw);
                    p.targetAnim = msg.anim;
                }
                break;
            case 'chat':
                if (msg.to === myId || msg.from === myId) receiveChat(msg.from, msg.to, msg.text, msg.timestamp);
                break;
            case 'chat-history':
                if (msg.partnerId === currentTargetId) renderHistoryMessages(msg.messages);
                break;
        }
        drawGraph();
    };
    ws.onclose = () => showToast('Соединение потеряно. Обновите страницу.');

    setInterval(() => {
        if (!localModel || !myId || ws.readyState !== WebSocket.OPEN) return;
        const isMoving = keys.w || keys.a || keys.s || keys.d;
        const currentAnim = isMoving ? (keys.shift ? 'run' : 'walk') : 'idle';
        ws.send(JSON.stringify({
            type: 'pos', id: myId,
            x: localModel.position.x, y: localModel.position.y, z: localModel.position.z,
            rx: localModel.quaternion.x, ry: localModel.quaternion.y, rz: localModel.quaternion.z, rw: localModel.quaternion.w,
            anim: currentAnim
        }));
    }, 50);

    function applyNicknameToGame(nick) {
        myNickname = nick;
        if (localModel) {
            const oldLabel = localModel.getObjectByName('label');
            if (oldLabel) localModel.remove(oldLabel);
            const newLabel = createTextLabel(nick, '#007bff');
            newLabel.name = 'label';
            localModel.add(newLabel);
        }
        if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'nickname-change', nick }));
        }
        drawGraph();
        updateProfileUI();
    }

    // ... остальная графика, сцена, анимации ...
    let scene, camera, renderer, clock, controls, raycaster, mouse;
    let localModel, localMixer;
    const localActions = { idle: null, walk: null, run: null };
    const keys = { w: false, a: false, s: false, d: false, shift: false };
    const walkDirection = new THREE.Vector3();
    const rotateQuaternion = new THREE.Quaternion();
    const cameraTarget = new THREE.Vector3();
    const RICK_MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';
    let currentTargetId = null;
    let currentTargetNick = '';
    const graphCanvas = document.getElementById('p2p-graph');
    const graphCtx = graphCanvas.getContext('2d');
    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    function toggleMobilePanel(show) {
        if (!isMobile) return;
        document.getElementById('mobile-controls').style.display = show ? 'flex' : 'none';
    }

    function drawGraph() { /* без изменений */ }
    function addRemotePlayer(id, nick) { /* ... */ }
    function removeRemotePlayer(id) { /* ... */ }
    function updateRemoteLabel(id, nick) { /* ... */ }

        charts.dauMau = new Chart(ctxDau, { type: 'line', data: { labels: ['1','2','3','4','5','6','7'], datasets: [{ label: 'DAU', data: [18420,18950,19320,19680,19850,20120,20400], borderColor: '#0077FF' }] } });
        // ... ещё графики
